<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDB Dateiverwaltung</title>
  <script>
    // Apply the cached appearance before the page draws (no flash). Full logic: js/prefs.js.
    try {
      var p = JSON.parse(localStorage.getItem("pdb.prefs") || "{}"), d = document.documentElement.dataset;
      var t = p.theme || localStorage.getItem("pdb.theme");
      if (t === "light" || t === "dark") d.theme = t;
      if (p.size) d.size = p.size;
      if (p.density) d.density = p.density;
      if (p.corners) d.corners = p.corners;
      if (p.header) d.header = p.header;
      if (p.sidebar === false) d.sidebar = "off";
      if (p.pictures === false) d.pictures = "off";
      d.motion = p.motion || "subtle";
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
